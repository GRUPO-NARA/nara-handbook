# Campos:
#   id            identificador único, minúsculo e sem acento (usado nas referências)
#   funcao        papel no laboratório (aparece em maiúsculas no site)
#   perfil        especialidade, mostrada como etiqueta no site
#   area          dados | backend | frontend | fullstack | infra
#   status        ativo | nivelamento | egresso
#   foto          caminho da foto na pasta public/ do site (ex.: equipe/julio.jpeg)
#   posicao_foto  enquadramento da foto no card (CSS object-position, ex.: "50% 60%")
#   projetos      lista de ids de data/projetos.yml
#   pesquisas     lista de ids de data/pesquisas.yml
#
# Campos sem informação ficam como null.

