name: Bug
description: Algo não funciona como deveria
title: "[Bug] "
labels: ["bug"]
# Projeto NARA — Roadmap (https://github.com/orgs/GRUPO-NARA/projects/3)
projects: ["GRUPO-NARA/3"]
body:
  - type: textarea
    id: descricao
    attributes:
      label: O que aconteceu
      description: Descreva o problema e o que era esperado.
    validations:
      required: true
  - type: textarea
    id: reproduzir
    attributes:
      label: Como reproduzir
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: dropdown
    id: ambiente
    attributes:
      label: Onde aconteceu
      options:
        - Produção
        - Ambiente local
        - Outro
    validations:
      required: true
  - type: textarea
    id: evidencias
    attributes:
      label: Evidências
      description: Prints, logs, mensagens de erro (opcional).
      render: shell
